<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 — Button</title>

  <!-- Inter, loaded from Google Fonts. No install, just a link. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <button class="btn" type="button" data-state="idle">Submit</button>
  </main>

  <!-- The custom cursor. aria-hidden: screen readers skip it, it's decoration. -->
  <div class="cursor" data-state="hidden" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
