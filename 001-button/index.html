<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>001 — Submit button</title>

  <!-- Inter, loaded from Google Fonts. Only used where San Francisco isn't
       available (anything that isn't an Apple device). No install, just a link. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- The component list on the left is shared by every page, so it lives one folder up. -->
  <link rel="stylesheet" href="../nav.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- data-page tells nav.js which item in the list is this page. -->
<body data-page="001-button">
  <p class="site-title">tristan’s motion lab</p>

  <main>
    <button class="btn" type="button" data-state="idle">Submit</button>
  </main>

  <!-- The custom cursor. aria-hidden: screen readers skip it, it's decoration.
       The shape is set in style.css (circle, or hand over clickables).
       The d="" here is a plain circle, only used by browsers that can't
       set a path's shape from CSS (Safari). -->
  <svg class="cursor" data-state="hidden" viewBox="0 0 32 44" aria-hidden="true">
    <path class="cursor-shape" d="M 2 16 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 Z" />
  </svg>

  <script src="../nav.js"></script>
  <script src="script.js"></script>
</body>
</html>
