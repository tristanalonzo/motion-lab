<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tristan’s motion lab</title>

  <!-- Inter, from Google Fonts. Only used where San Francisco isn't available.
       Fonts must load here, on the one real page: a font loaded from inside
       an experiment's sealed box doesn't work in every browser. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- wght@300..700 = one "variable" font file holding every weight in between,
       so a weight change can animate smoothly instead of snapping. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="site/site.css">
  <link rel="stylesheet" href="site/nav.css">
  <link rel="stylesheet" href="site/toolbar.css">
  <link rel="stylesheet" href="site/socials.css">
  <link rel="stylesheet" href="site/cursor.css">
</head>
<body>
  <!-- The title goes home, to 000. -->
  <a class="site-title" href="./">tristan’s motion lab</a>

  <!-- Experiments are put in here, one at a time, by site/stage.js. -->
  <div class="stage-area"></div>

  <!-- Says "coming soon", "loading", or that something broke. Starts empty. -->
  <p class="stage-message" data-state="empty" aria-live="polite"></p>

  <!-- Opened by double-clicking (a file:/// address)? Then the site's code
       can't load, so say how to run it. Runs before anything is drawn, so
       on a real server (localhost, GitHub Pages) this never flashes. -->
  <script>
    if (location.protocol === "file:") {
      const message = document.querySelector(".stage-message");
      // One <span> around it all: the message is a grid, which would put
      // each loose piece of text on its own row.
      message.innerHTML = "<span>Run <code>py -m http.server</code> in this folder, then open localhost:8000.</span>";
      message.dataset.state = "shown";
    }
  </script>

  <!-- The list on the left is built by site/nav.js. -->

  <!-- The toolbar, bottom middle. site/toolbar.js points </> at the open
       experiment's folder. target="_blank" opens it in a new tab, so the
       lab stays where you left it; rel="noopener" stops that tab from being
       able to reach back into this one. -->
  <nav class="toolbar" aria-label="experiment tools">
    <a class="tool tool-code" target="_blank" rel="noopener">
      <!-- </>: three strokes, so < and > can slide apart on their own. -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="code-left" d="M8 7l-5 5 5 5" />
        <path class="code-slash" d="M14 5l-4 14" />
        <path class="code-right" d="M16 7l5 5-5 5" />
      </svg>
      <span class="tool-label">view code</span>
    </a>
  </nav>

  <!-- Bottom right: where else to find me. site/socials.js plays the cat. -->
  <nav class="socials" aria-label="elsewhere">
    <a class="social social-github" href="https://github.com/tristanalonzo" target="_blank" rel="noopener" data-state="ready">
      <!-- GitHub's mark (from their free Octicons set), taken apart so the cat
           can move on its own: a circle with a page-coloured cat on top.
           Hover and the cat jumps out of the circle and sits on it, and an
           arrow takes its place. 16 units across; overflow: visible in
           socials.css lets the cat climb out above the button. -->
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <!-- Keeps the cat inside the circle when it squashes wide. -->
        <clipPath id="github-circle">
          <circle cx="8" cy="8" r="8" />
        </clipPath>

        <!-- Drawn in this order, each on top of the one before. -->
        <path class="social-fill github-cat github-cat-out" d="M10.55 15.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A8 8 0 0 0 10.55 15.59Z" />
        <circle class="social-fill github-circle" cx="8" cy="8" r="8" />
        <g clip-path="url(#github-circle)">
          <path class="social-hole github-cat github-cat-in" d="M10.55 15.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A8 8 0 0 0 10.55 15.59Z" />
        </g>
        <path class="github-arrow" d="M8 11.6V4.8M5.2 7.6 8 4.8l2.8 2.8" />
      </svg>
      <span class="social-label">github</span>
    </a>

    <!-- Every logo below is drawn as itself, all the same height: each
         viewBox crops tight around its logo, and socials.css sets the height.
         The white parts are holes, painted the page's grey so they read as cut out.
         Each one is split into the pieces its hover moves (socials.css). -->

    <!-- LinkedIn: the rounded square, with "in" cut out. -->
    <a class="social social-linkedin" href="https://www.linkedin.com/in/tristan-alonzo-959b15317/" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect class="social-fill" width="16" height="16" rx="1.9" />
        <rect class="social-hole linkedin-i" x="2.45" y="6.07" width="2.39" height="7.7" />
        <circle class="social-hole linkedin-dot" cx="3.63" cy="3.64" r="1.41" />
        <path class="social-hole" d="M6.36 6.07H8.64V7.1C8.64 7.1 9.36 5.84 11 5.84 12.75 5.84 13.77 7.2 13.77 8.95V13.77H11.4V9.7C11.4 8.8 11.1 8 10.1 8 9.1 8 8.64 8.7 8.64 9.8V13.77H6.36Z" />
      </svg>
      <span class="social-label">linkedin</span>
    </a>

    <!-- Instagram: the rounded square, with the camera cut out. A white
         square on top sits invisible until the camera flashes. -->
    <a class="social social-instagram" href="https://www.instagram.com/tristanalonzo_/" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect class="social-fill" width="16" height="16" rx="3.75" />
        <rect class="instagram-body" x="2.6" y="2.6" width="10.8" height="10.8" rx="2.6" />
        <circle class="instagram-lens" cx="8" cy="8" r="2.52" />
        <circle class="social-hole instagram-flash" cx="11.18" cy="4.83" r="0.71" />
        <rect class="instagram-burst" width="16" height="16" rx="3.75" />
      </svg>
      <span class="social-label">instagram</span>
    </a>

    <!-- X: the square, with their mark (via Simple Icons, free to use) cut
         out, shrunk from 24 units to 9. -->
    <a class="social social-x" href="https://x.com/tristanalonzo_" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect class="social-fill" width="16" height="16" />
        <g transform="translate(3.55 3.55) scale(0.37)">
          <path class="social-hole x-mark" d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" />
        </g>
      </svg>
      <span class="social-label">x</span>
    </a>

    <!-- Email: Gmail's M, in one piece. On hover socials.css sends it off
         like a letter.
         mailto: opens the visitor's mail app, so no new tab. -->
    <a class="social social-email" href="mailto:treestan.alonzo@gmail.com">
      <svg viewBox="2 3.5 12 9" aria-hidden="true">
        <path class="social-fill email-m" d="M2 4.9C2 3.9 2.8 3.5 3.4 3.5C3.8 3.5 4.1 3.6 4.4 3.8L8 6.5L11.6 3.8C11.9 3.6 12.2 3.5 12.6 3.5C13.2 3.5 14 3.9 14 4.9V11.7C14 12.2 13.6 12.5 13.1 12.5H11.3V7.8L8 10.3L4.7 7.8V12.5H2.9C2.4 12.5 2 12.2 2 11.7Z" />
      </svg>
      <span class="social-label">email</span>
    </a>
  </nav>

  <!-- The site-wide cursor. aria-hidden: screen readers skip it, it's decoration.
       The shape is set in site/cursor.css. The d="" here is a plain circle,
       only used by browsers that can't set a path's shape from CSS (Safari). -->
  <svg class="cursor" data-state="away" viewBox="0 0 32 44" aria-hidden="true">
    <path class="cursor-shape" d="M 2 16 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 Z" />
  </svg>

  <!-- type="module" lets the site's files import each other, and lets the
       stage load experiments on demand. Both need a server (see README.md). -->
  <script type="module" src="site/main.js"></script>
</body>
</html>
