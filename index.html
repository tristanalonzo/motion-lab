<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tristan’s motion lab</title>

  <!-- Inter, from Google Fonts. Only used where San Francisco isn't available.
       Fonts must load here, on the one real page: a font loaded from inside
       an experiment's sealed box doesn't work in every browser. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="site/site.css">
  <link rel="stylesheet" href="site/nav.css">
  <link rel="stylesheet" href="site/cursor.css">
</head>
<body>
  <!-- The title goes home, to 000. -->
  <a class="site-title" href="./">tristan’s motion lab</a>

  <!-- Experiments are put in here, one at a time, by site/stage.js. -->
  <div class="stage-area"></div>

  <!-- Says "coming soon", "loading", or that something broke.
       The text below only stays if the site's code never ran, which is what
       happens when this file is opened by double-clicking instead of through a server. -->
  <p class="stage-message" data-state="shown" aria-live="polite">
    Run <code>py -m http.server</code> in this folder, then open localhost:8000.
  </p>

  <!-- The list on the left is built by site/nav.js. -->

  <!-- The site-wide cursor. aria-hidden: screen readers skip it, it's decoration.
       The shape is set in site/cursor.css. The d="" here is a plain circle,
       only used by browsers that can't set a path's shape from CSS (Safari). -->
  <svg class="cursor" data-state="away" viewBox="0 0 32 44" aria-hidden="true">
    <path class="cursor-shape" d="M 2 16 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 Z" />
  </svg>

  <!-- type="module" lets the site's files import each other, and lets the
       stage load experiments on demand. Both need a server (see README.md). -->
  <script type="module" src="site/main.js"></script>
</body>
</html>
